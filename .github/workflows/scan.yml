name: Daily Stock Scan

on:
  schedule:
    # 6pm UTC = 7am NZT (UTC+13 summer) — runs after prior day's US close data is settled
    - cron: '0 18 * * 1-5'
  workflow_dispatch:   # allows manual trigger from GitHub Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push scan_results.json back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance requests pandas lxml

      - name: Run scan
        run: python scan.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scan_results.json scan_results.csv
          git diff --staged --quiet || git commit -m "Automated scan $(date -u '+%Y-%m-%d')"
          git push
